            - heading "What is Smart India Hackathon?" [level=2] [ref=f2e71]
          - paragraph [ref=f2e72]: Smart India Hackathon is the Government of India's apex student innovation competition. It challenges young technologists to devise production-ready solutions for complex operational bottlenecks submitted by central ministries, state departments, and premier enterprises.
