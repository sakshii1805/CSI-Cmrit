            - heading "Team Composition Rules" [level=3] [ref=f2e195]
          - paragraph [ref=f2e196]: "As per official Smart India Hackathon guidelines, every participating team must satisfy strict statutory formation rules:"
          - list [ref=f2e197]:
            - listitem [ref=f2e198]:
              - generic [ref=f2e199]: "01"
              - generic [ref=f2e200]:
                - strong [ref=f2e201]: "Exactly 6 members:"
                - text: Teams cannot exceed or fall short of the 6-student cohort rule.
            - listitem [ref=f2e202]:
              - generic [ref=f2e203]: "02"
              - generic [ref=f2e204]:
                - strong [ref=f2e205]: "Mandatory female representation:"
                - text: At least 1 female engineer must be on the registered team.
            - listitem [ref=f2e206]:
              - generic [ref=f2e207]: "03"
              - generic [ref=f2e208]:
                - strong [ref=f2e209]: "Active CMRIT enrollment:"
                - text: All participants must be active undergraduate students of the institution.
            - listitem [ref=f2e210]:
              - generic [ref=f2e211]: "04"
              - generic [ref=f2e212]:
                - strong [ref=f2e213]: "Interdisciplinary teams:"
                - text: Combining software, electronics, and mechanical disciplines is recommended.
