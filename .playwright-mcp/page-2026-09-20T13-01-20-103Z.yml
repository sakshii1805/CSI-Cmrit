          - heading "An Inclusive, Student-Driven Community" [level=2] [ref=f1e147]
          - paragraph [ref=f1e148]: At the heart of CSI CMRIT is a vibrant culture of peer knowledge sharing. Seniors mentor juniors, multidisciplinary teams combine hardware and software proficiencies, and all members are encouraged to experiment without the fear of failure.
          - paragraph [ref=f1e149]: Whether you are writing your first lines of code or building distributed microservices, our community provides the constructive environment, feedback, and encouragement you need to grow.
