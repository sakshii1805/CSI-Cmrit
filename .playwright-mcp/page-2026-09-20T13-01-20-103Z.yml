      - generic [ref=f1e46]:
        - generic [ref=f1e47]: INSTITUTIONAL CHARTER
        - heading "About CSI CMRIT" [level=1] [ref=f1e49]
        - paragraph [ref=f1e50]: Fostering practical engineering craft, national hackathon incubation, and collaborative peer learning at CMR Institute of Technology, Hyderabad.
      - generic [ref=f1e53]:
        - generic [ref=f1e54]:
          - text: // APEX BODY
          - heading "Computer Society of India (CSI)" [level=2] [ref=f1e55]
          - paragraph [ref=f1e56]: The Computer Society of India (CSI) is the premier association of IT professionals and computer scientists across India. Established in 1965, CSI advances theory and practice in computer engineering, facilitating national knowledge exchange, conferences, technical seminars, and student developmental chapters nationwide.
          - paragraph [ref=f1e57]: Student chapters under CSI bridge the academic syllabus with rapidly evolving industrial frameworks, enabling members to learn directly from active industry practitioners.
        - generic [ref=f1e58]:
          - text: // STUDENT CHAPTER
          - heading "CSI CMRIT Student Chapter" [level=2] [ref=f1e59]
          - paragraph [ref=f1e60]: The CSI Student Chapter at CMR Institute of Technology, Hyderabad, functions as an active student-led technical council. The chapter brings together students across CSE, IT, AI&ML, and ECE who share a commitment to software development, cloud infrastructure, and competitive problem solving.
          - paragraph [ref=f1e61]: Through practical workshop series, hackathon incubation squads, and continuous code sprints, the chapter prepares students to build production-grade solutions for real problems.
      - generic [ref=f1e64]:
        - generic [ref=f1e65]:
          - generic [ref=f1e66]:
            - text: CHAPTER CHARTER
            - heading "Our Vision & Operational Mission" [level=2] [ref=f1e67]
          - generic [ref=f1e68]: EXCELLENCE • ETHICS • LEADERSHIP
        - generic [ref=f1e69]:
          - generic [ref=f1e70]:
            - generic [ref=f1e71]: 01. Chapter Vision
            - heading "Engineering Leaders with Practical Mastery" [level=3] [ref=f1e73]
            - paragraph [ref=f1e74]: To cultivate a premier, inclusive, and forward-looking collegiate technology community at CMRIT that inspires students to pursue technical excellence, solve real-world challenges with integrity, and evolve into ethical engineering leaders of tomorrow.
          - generic [ref=f1e75]:
            - generic [ref=f1e76]: 02. Chapter Mission
            - heading "Practical Delivery & National Impact" [level=3] [ref=f1e78]
            - paragraph [ref=f1e79]: To deliver structured hands-on workshops, facilitate competitive coding and hackathons like SIH, nurture collaborative peer research, and bridge students with industry mentors to develop high-impact software and systems.
